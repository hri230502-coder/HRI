<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 · 나의 칸반 보드</title><style>
:root{--bg:#f6f7fb;--paper:#fff;--ink:#202938;--muted:#687487;--line:#e3e7ef;--accent:#5555d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a6a6ff;outline-offset:2px}button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;color:var(--ink)}button:hover{background:#f0f1fa}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#4343ba}.shell{max-width:1500px;margin:auto;padding:28px 38px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:11px;align-items:center;font-size:22px;font-weight:800;letter-spacing:-1px}.logo{display:grid;place-items:center;background:var(--accent);color:white;border-radius:12px;width:38px;height:38px}.tag{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.intro{margin:40px 0 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}h1{font-size:32px;letter-spacing:-1.2px;margin:0 0 5px}p{margin:0;color:var(--muted)}.date{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:16px 20px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin-top:3px}.stat:last-child strong{color:var(--accent)}.tools{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.tools input{flex:1;min-width:180px}.tools input,.tools select{border:1px solid var(--line);border-radius:9px;background:white;padding:10px 13px;color:var(--ink)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.column{background:#edf0f6;border:1px solid #e6e9f0;border-radius:15px;padding:16px;min-height:390px}.colhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.coltitle{font-weight:750;display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#8590a3}.doing .dot{background:#7772e7}.done .dot{background:#30a789}.count{font-size:12px;color:var(--muted);background:#dfe4ed;padding:0 7px;border-radius:5px}.addsmall{padding:1px 9px;font-size:21px;border:0;background:transparent;color:var(--muted)}.cards{min-height:260px}.card{background:white;border:1px solid #e1e5ed;border-radius:11px;padding:17px;margin-bottom:12px;box-shadow:0 2px 3px #26314904;cursor:grab}.card:hover{border-color:#b4b4e6;box-shadow:0 5px 12px #2631490a}.card.dragging{opacity:.4}.column.over{outline:2px dashed var(--accent);background:#e9e9fa}.cardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.priority{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px}.high{background:#fff0ed;color:#b64032}.medium{background:#fff6de;color:#886200}.low{background:#eaf5ef;color:#26734d}.edit{border:0;padding:0 5px;background:none;color:var(--muted);font-size:18px}.card h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}.desc{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.cardfoot{border-top:1px solid #f0f1f5;margin-top:14px;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.due{font-size:11px;color:var(--muted)}.late{color:#b64032}.move{max-width:115px;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:4px;background:white;color:var(--muted)}.empty{font-size:12px;color:var(--muted);text-align:center;padding:60px 10px;border:1px dashed #d1d7e2;border-radius:10px}.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}footer{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-top:32px;border-top:1px solid var(--line);padding-top:16px}dialog{border:1px solid var(--line);border-radius:18px;width:min(520px,calc(100% - 30px));padding:28px;color:var(--ink)}dialog::backdrop{background:#19223865;backdrop-filter:blur(3px)}dialog h2{margin:0 0 20px;font-size:22px}label{display:block;font-weight:600;font-size:12px;margin-bottom:14px}label input,label textarea,label select{display:block;width:100%;border:1px solid #d6dce7;border-radius:8px;padding:10px;margin-top:6px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modalfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:23px}.danger{color:#b64032;margin-right:auto}.close{float:right;border:0;padding:0 6px;font-size:22px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#202938;color:white;border-radius:10px;padding:11px 20px;z-index:10;max-width:90%;font-size:13px}.hidden{display:none}@media(max-width:850px){.shell{padding:22px 18px}.board{gap:12px}.column{padding:11px}.intro{margin-top:28px}h1{font-size:27px}.tag{display:none}}@media(max-width:620px){.board{grid-template-columns:1fr}.column{min-height:200px}.cards{min-height:100px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px 15px}.intro{display:block}.date{margin-top:10px}.top{align-items:flex-start}.actions button{padding:7px 9px;font-size:12px}.actions{justify-content:flex-end}.brand{white-space:nowrap}.tools .primary{width:100%}footer{flex-direction:column}.empty{padding:30px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="logo">▥</span>HRI <span class="tag">PERSONAL WORKSPACE</span></div><div class="actions"><button id="export">↓ 백업</button><button id="import">↑ 복원</button></div></header><section class="intro"><div><h1>차근차근 하나씩 !!!</h1><p>머릿속의 계획을 꺼내고, 나만의 속도로 완성하세요.</p></div><div class="date" id="today"></div></section><section class="stats" aria-label="할 일 현황"><div class="stat"><span>전체 할 일</span><strong id="total">0</strong></div><div class="stat"><span>진행 중</span><strong id="active">0</strong></div><div class="stat"><span>완료한 일</span><strong id="finished">0</strong></div><div class="stat"><span>완료율</span><strong id="rate">0%</strong></div></section><section class="tools" aria-label="검색 및 필터"><input id="search" type="search" aria-label="할 일 검색" placeholder="⌕  제목이나 내용으로 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="">모든 우선순위</option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select><select id="sort" aria-label="정렬"><option value="created">최근 추가순</option><option value="due">마감일순</option><option value="priority">우선순위순</option></select><button class="primary" id="newTask">＋ 새 할 일</button></section><section class="board" aria-label="칸반 보드"><section class="column todo" data-status="todo"><div class="colhead"><div class="coltitle"><i class="dot"></i>할 일 <span class="count" id="count-todo">0</span></div><button class="addsmall" data-add="todo" aria-label="할 일 추가">＋</button></div><div class="cards" id="list-todo"></div></section><section class="column doing" data-status="doing"><div class="colhead"><div class="coltitle"><i class="dot"></i>진행 중 <span class="count" id="count-doing">0</span></div><button class="addsmall" data-add="doing" aria-label="진행 중 할 일 추가">＋</button></div><div class="cards" id="list-doing"></div></section><section class="column done" data-status="done"><div class="colhead"><div class="coltitle"><i class="dot"></i>완료 <span class="count" id="count-done">0</span></div><button class="addsmall" data-add="done" aria-label="완료 할 일 추가">＋</button></div><div class="cards" id="list-done"></div></section></section><p class="hint">카드를 드래그하거나 카드 아래의 상태 메뉴로 이동하세요. · 카드 제목을 누르면 수정할 수 있어요.</p><footer><span id="saveState" role="status">이 브라우저에 자동 저장됩니다.</span><span>내 컴퓨터, 나만의 작업 공간 · 모아</span></footer></main><dialog id="editor"><form id="taskForm"><button type="button" class="close" id="close" aria-label="닫기">×</button><h2 id="modalTitle">새 할 일</h2><label>제목 *<input id="title" required maxlength="150" placeholder="어떤 일을 할까요?"></label><label>메모<textarea id="description" maxlength="5000" placeholder="필요한 내용이나 아이디어를 적어두세요."></textarea></label><div class="row"><label>상태<select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></label><label>우선순위<select id="priority"><option value="low">낮음</option><option value="medium" selected>보통</option><option value="high">높음</option></select></label></div><label>마감일<input id="due" type="date" min="1900-01-01" max="9999-12-31"></label><div class="modalfoot"><button type="button" id="delete" class="danger">삭제</button><button type="button" id="cancel">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><input type="file" id="file" accept="application/json,.json" hidden><div id="toast" class="notice hidden" role="status"></div>
<script>
'use strict';
const KEY='moa-kanban-v1', $=id=>document.getElementById(id), states={todo:'할 일',doing:'진행 중',done:'완료'}, priorities={high:'높음',medium:'보통',low:'낮음'};
let tasks=[],editing=null,dragId=null,timer,storageOK=true;
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function valid(t){return t&&typeof t.id==='string'&&t.id.length>0&&typeof t.title==='string'&&t.title.trim().length>0&&t.title.length<=150&&typeof t.description==='string'&&t.description.length<=5000&&Object.hasOwn(states,t.status)&&Object.hasOwn(priorities,t.priority)&&typeof t.due==='string'&&(!t.due||(/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&!isNaN(Date.parse(t.due))&&new Date(t.due).toISOString().slice(0,10)===t.due))&&Number.isFinite(t.created)}
try{const raw=localStorage.getItem(KEY);if(raw!==null){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(valid)||new Set(parsed.map(t=>t.id)).size!==parsed.length)throw Error('invalid');tasks=parsed}}catch(e){storageOK=false;$('saveState').textContent='저장된 데이터를 읽지 못했습니다. 백업 파일을 복원하거나 현재 작업을 백업하세요.';notify('자동 저장 공간을 읽지 못했습니다. 기존 데이터는 덮어쓰지 않습니다.')}
function persist(){if(!storageOK){notify('자동 저장이 비활성화되어 있습니다. 작업 내용을 백업해 주세요.');return}try{localStorage.setItem(KEY,JSON.stringify(tasks));$('saveState').textContent='✓ 이 브라우저에 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}catch(e){$('saveState').textContent='저장 실패 · 백업 버튼으로 데이터를 보관하세요.';notify('저장 공간이 부족하거나 차단되어 있습니다. 백업해 주세요.')}}
function localDay(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),p=$('priorityFilter').value;let visible=tasks.filter(t=>(!p||t.priority===p)&&(!q||(t.title+' '+t.description).toLocaleLowerCase().includes(q)));const order={high:0,medium:1,low:2};visible.sort((a,b)=>$('sort').value==='due'?(a.due||'9999-99-99').localeCompare(b.due||'9999-99-99')||b.created-a.created:$('sort').value==='priority'?order[a.priority]-order[b.priority]||b.created-a.created:b.created-a.created);$('total').textContent=tasks.length;$('active').textContent=tasks.filter(t=>t.status==='doing').length;const done=tasks.filter(t=>t.status==='done').length;$('finished').textContent=done;$('rate').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
for(const s of Object.keys(states)){const list=$('list-'+s);list.replaceChildren();const group=visible.filter(t=>t.status===s);$('count-'+s).textContent=group.length;for(const t of group){const card=el('article','card');card.draggable=true;const top=el('div','cardtop');top.append(el('span','priority '+t.priority,priorities[t.priority]));const edit=el('button','edit','⋯');edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openEditor(t.id);top.append(edit);const title=el('h3');const titleBtn=el('button','',t.title);titleBtn.style.cssText='border:0;background:none;padding:0;text-align:left;font-weight:700;overflow-wrap:anywhere';titleBtn.onclick=()=>openEditor(t.id);title.append(titleBtn);card.append(top,title);if(t.description)card.append(el('p','desc',t.description));const foot=el('div','cardfoot');const overdue=t.due&&t.due<localDay()&&s!=='done';foot.append(el('span','due'+(overdue?' late':''),t.due?(overdue?'기한 지남 · ':'마감 · ')+t.due:'마감일 없음'));const sel=el('select','move');sel.setAttribute('aria-label',t.title+' 상태');for(const [v,label]of Object.entries(states)){const opt=el('option','',label);opt.value=v;sel.append(opt)}sel.value=s;sel.onchange=()=>move(t.id,sel.value);foot.append(sel);card.append(foot);card.ondragstart=e=>{if(e.target.closest('button,select')){e.preventDefault();return}dragId=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')};card.ondragend=()=>{dragId=null;card.classList.remove('dragging');document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))};list.append(card)}if(!group.length)list.append(el('div','empty',q||p?'조건에 맞는 할 일이 없어요.':s==='todo'?'새로운 할 일을 추가해 보세요.':s==='doing'?'집중할 일을 이곳으로 옮겨보세요.':'완료한 일이 이곳에 모여요.'))}}
function move(id,status){const t=tasks.find(t=>t.id===id);if(!t||!Object.hasOwn(states,status))return;t.status=status;persist();render()}
function openEditor(id=null,status='todo'){editing=id;const t=tasks.find(x=>x.id===id);$('taskForm').reset();$('modalTitle').textContent=t?'할 일 수정':'새 할 일';$('title').value=t?.title||'';$('description').value=t?.description||'';$('status').value=t?.status||status;$('priority').value=t?.priority||'medium';$('due').value=t?.due||'';$('delete').classList.toggle('hidden',!t);$('editor').showModal();$('title').focus()}
$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('제목을 입력해 주세요.');$('title').reportValidity();return}const old=tasks.find(t=>t.id===editing);const task={id:old?.id||(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),title,description:$('description').value.trim(),status:$('status').value,priority:$('priority').value,due:$('due').value,created:old?.created||Date.now()};if(!valid(task)){notify('입력한 내용을 확인해 주세요.');return}if(old)tasks[tasks.indexOf(old)]=task;else tasks.push(task);persist();render();$('editor').close()};$('title').oninput=()=>$('title').setCustomValidity('');$('delete').onclick=()=>{if(confirm('이 할 일을 삭제할까요? 삭제한 내용은 되돌릴 수 없습니다.')){tasks=tasks.filter(t=>t.id!==editing);persist();render();$('editor').close()}};for(const id of ['close','cancel'])$(id).onclick=()=>$('editor').close();$('newTask').onclick=()=>openEditor();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openEditor(null,b.dataset.add));for(const id of ['search','priorityFilter','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
document.querySelectorAll('.column').forEach(c=>{c.ondragover=e=>{if(dragId){e.preventDefault();e.dataTransfer.dropEffect='move';c.classList.add('over')}};c.ondragleave=e=>{if(!c.contains(e.relatedTarget))c.classList.remove('over')};c.ondrop=e=>{e.preventDefault();c.classList.remove('over');if(dragId)move(dragId,c.dataset.status);dragId=null}});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moa-backup-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 다운로드합니다.')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('size');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.tasks)||!data.tasks.every(valid)||new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length)throw Error('format');if(confirm('현재 목록을 백업 파일의 '+data.tasks.length+'개 할 일로 교체할까요? 기존 목록이 필요하면 먼저 취소하고 백업하세요.')){tasks=data.tasks.map(t=>({id:t.id,title:t.title,description:t.description,status:t.status,priority:t.priority,due:t.due,created:t.created}));storageOK=true;persist();render();notify('백업 데이터를 불러왔습니다.')}}catch(err){notify('복원 실패: 올바른 모아 백업 JSON 파일(10MB 이하)을 선택하세요.')}finally{e.target.value=''}};
$('today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});render();
</script></body></html>
